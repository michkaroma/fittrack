<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- FitTrack : ligne de tendance ambre sur charcoal — esprit instrument de mesure -->
  <rect width="512" height="512" rx="112" fill="#0e0f10"/>
  <!-- grille horizontale (hairlines neutres) -->
  <g stroke="#303236" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <line x1="104" y1="184" x2="408" y2="184"/>
    <line x1="104" y1="272" x2="408" y2="272"/>
    <line x1="104" y1="360" x2="408" y2="360"/>
  </g>
  <!-- courbe de tendance (accent unique) -->
  <polyline points="104,356 184,300 256,322 336,214 408,150"
            fill="none" stroke="#e8af3c" stroke-width="24"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- dernier point mesuré : pastille ambre cerclée de fond -->
  <circle cx="408" cy="150" r="28" fill="#0e0f10"/>
  <circle cx="408" cy="150" r="16" fill="#e8af3c"/>
</svg>
