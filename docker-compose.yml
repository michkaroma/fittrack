services:
  fittrack:
    build: .
    container_name: fittrack
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8084:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
