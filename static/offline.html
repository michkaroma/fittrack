<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Hors ligne · FitTrack</title>
		<style>
			:root {
				color-scheme: dark;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: #0e0f10;
				color: #ededef;
				font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
			}
			main {
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1rem;
				padding: 2rem;
				text-align: center;
			}
			svg {
				width: 56px;
				height: 56px;
			}
			h1 {
				margin: 0;
				font-size: 1.375rem;
				font-weight: 700;
			}
			p {
				margin: 0;
				max-width: 22rem;
				color: #a2a5aa;
				line-height: 1.5;
			}
			button {
				margin-top: 0.5rem;
				height: 2.75rem;
				padding: 0 1.25rem;
				border: none;
				border-radius: 10px;
				background: #e8af3c;
				color: #0e0f10;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
			button:active {
				transform: translateY(1px);
			}
		</style>
	</head>
	<body>
		<main>
			<svg viewBox="0 0 512 512" aria-hidden="true">
				<rect width="512" height="512" rx="112" fill="#1e1f22" />
				<polyline
					points="104,356 184,300 256,322 336,214 408,150"
					fill="none"
					stroke="#e8af3c"
					stroke-width="30"
					stroke-linecap="round"
					stroke-linejoin="round"
				/>
				<circle cx="408" cy="150" r="28" fill="#1e1f22" />
				<circle cx="408" cy="150" r="16" fill="#e8af3c" />
			</svg>
			<h1>Hors ligne</h1>
			<p>FitTrack a besoin d'une connexion. Reconnecte-toi puis réessaie.</p>
			<button type="button" onclick="location.reload()">Réessayer</button>
		</main>
	</body>
</html>
