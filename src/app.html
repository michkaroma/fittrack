<!doctype html>
<html lang="fr" class="dark" style="color-scheme: dark">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
		/>
		<meta name="theme-color" content="#0e0f10" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="FitTrack" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<script>
			// Enregistrement du service worker (PWA) — désactivé en dev local.
			if (
				'serviceWorker' in navigator &&
				location.hostname !== 'localhost' &&
				location.hostname !== '127.0.0.1'
			) {
				window.addEventListener('load', function () {
					navigator.serviceWorker.register('/sw.js').catch(function () {});
				});
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-bg text-ink">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
